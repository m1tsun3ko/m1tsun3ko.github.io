<!doctype html>
<html lang="en" dir="ltr">
  
<head>
<style>
html{background:#000}
body{background:#000;margin:0;color:#fff}

html {
  background: #000;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: #fff;
  overflow: hidden;
}

#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;

  z-index: 1;
  pointer-events: none;
  user-select: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 2;
  pointer-events: none;
}

#main-content {
  position: relative;
  z-index: 3;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;
}

.center-card {
  width: 420px;
  max-width: 78vw;
  height: auto;

transform: translateY(120px);

  border-radius: 0;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

@font-face {
  font-family: 'SpecialElite';
  src: url('/addict/SpecialElite.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

.center-text {
  position: absolute;
  top: -13%;
  left: 50%;

  transform: translate(-50%, calc(-50% + 200px));

  font-family: 'SpecialElite', sans-serif;
  font-size: 33px;
  color: white;

  z-index: 4;

  pointer-events: none;
  user-select: none;
}

.ct-text {
  position: absolute;
  top: 65%;
  left: 50%;

  transform: translate(-50%, calc(-50% + 200px));

  font-family: 'SpecialElite', sans-serif;
  font-size: 9px;
  color: white;

  z-index: 4;

  pointer-events: none;
  user-select: none;
}

.basic-text {
  position: absolute;
  top: 50%;
  left: 50%;

  transform: translate(-50%, calc(-50% + 200px));

  font-family: 'SpecialElite', sans-serif;
  font-size: 12px;
  color: white;

  z-index: 4;

  pointer-events: none;
  user-select: none;
}

.links {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%, calc(-50% + 200px));

  display: flex;
  gap: 20px;

  font-family: 'SpecialElite', sans-serif;
  font-size: 12px;

  z-index: 4;
}

.links a {
  color: white;
  text-decoration: none;
}

.links a:hover {
  text-decoration: underline;
}
  
</style>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Projects [Rawrrr Ent.]</title>
  <meta name="description" content="Projects of Rawrrr Entertainment.">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="index, follow">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">


  <link rel="canonical" href="https://www.meflakes.me/">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">


  <script src="/addict/main.js" defer></script>

      <div class="center-text">
  projects
</div>
  
</head>

<body>
  <noscript>
    For the website to work, you need JavaScript.
  </noscript>


  <main id="main-content">
    <img
      class="center-card"
      src="/addict/welcome.png"
      alt="Rawrrr Entertainment"
      draggable="false"
    >

    <div class="links">
  <a href="javascript:history.back()">back</a>
</div>

<div class="ct-text">
  © all rights reserved, 2023.
</div>
    
  </main>

  <script>
    document.querySelectorAll('img, video').forEach(el => {
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.addEventListener('dragstart', e => e.preventDefault());
    });
  </script>

  <footer>
  </footer>
</body>
</html>
